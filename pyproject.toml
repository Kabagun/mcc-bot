[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcc-bot"
version = "0.1.0"
description = "Telegram bot for looking up card moneyback by merchant category code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1,<2",
    "python-telegram-bot[job-queue]>=22.6,<23",
    "httpx>=0.27,<1",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
mcc-bot = "mcc_bot.bot:main"
mcc-check = "mcc_bot.cli:main"
mcc-broadcast = "mcc_bot.broadcast:main"
mcc-import-stores = "mcc_bot.import_stores:main"
mcc-apply-curated-stores-20260828 = "mcc_bot.curated_stores_20260828:main"
mcc-apply-partner-seed-20260830 = "mcc_bot.partner_seed_20260830:main"
mcc-reconcile-partners-20260830 = "mcc_bot.partner_cleanup_20260830:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcc_bot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
